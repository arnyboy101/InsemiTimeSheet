name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check Project/

      - name: Run ruff format check
        run: ruff format --check Project/

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project/Infrastructure/InsemiSystem
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ${{ github.workspace }}/requirements.txt

      - name: Run Django checks
        run: python manage.py check --deploy 2>&1 || true
        env:
          DJANGO_SETTINGS_MODULE: InsemiSystem.settings

      - name: Run tests
        run: pytest --tb=short -q
        env:
          DJANGO_SETTINGS_MODULE: InsemiSystem.settings

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt || true
